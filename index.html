<html lang="th">
<head>
<meta charset="utf-8">

<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.2/dist/hanzi-writer.min.js"></script>
<style>
/* Layout: sticky level bar + one working column; word cards echo the book's pastel card grid with a checkbox strip */
:root{
  --bg:#fbf7f9; --surface:#ffffff; --fg:#2b2330; --muted:#7a6d7f; --line:#ecdfe7;
  --pink:#e2558f; --pink-soft:#fde4ef; --mint:#cdeeee; --mint-ink:#1f7b7d;
  --ok:#2f9e6b; --ok-soft:#dcf3e7; --warn:#c98a12; --warn-soft:#fbefd2; --no:#c84a4a; --no-soft:#f9e0e0;
  --f-th:"Sarabun","Noto Sans Thai",system-ui,sans-serif;
  --f-hz:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-zh:"Noto Sans TC","PingFang TC",sans-serif;
  --r:14px;
  --nature:#2e8a6a; --nature-t:#d7efe5; --body:#b5761a; --body-t:#f7e7c8; --thing:#4559b8; --thing-t:#dde2f7; --word:#b93f72; --word-t:#f6dbe7;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b161d; --surface:#251e28; --fg:#f3ecf4; --muted:#ab9db0; --line:#3a3040;
  --pink:#ff7fb1; --pink-soft:#4a2337; --mint:#1f3f40; --mint-ink:#8fdcdc;
  --ok:#5fd09a; --ok-soft:#1d3a2c; --warn:#f0bb52; --warn-soft:#3f3218; --no:#f08585; --no-soft:#432424;
  --nature:#5cc59d; --nature-t:#173a2f; --body:#e3a647; --body-t:#3b2c12; --thing:#8a9cf0; --thing-t:#1f2650; --word:#e57aa6; --word-t:#3d1b2b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b161d; --surface:#251e28; --fg:#f3ecf4; --muted:#ab9db0; --line:#3a3040;
  --pink:#ff7fb1; --pink-soft:#4a2337; --mint:#1f3f40; --mint-ink:#8fdcdc;
  --ok:#5fd09a; --ok-soft:#1d3a2c; --warn:#f0bb52; --warn-soft:#3f3218; --no:#f08585; --no-soft:#432424;
  --nature:#5cc59d; --nature-t:#173a2f; --body:#e3a647; --body-t:#3b2c12; --thing:#8a9cf0; --thing-t:#1f2650; --word:#e57aa6; --word-t:#3d1b2b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-th);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand small{color:var(--pink);font-weight:600;letter-spacing:.08em;font-size:12px;text-transform:uppercase}
.brand h1{margin:0;font-size:clamp(22px,4vw,30px);line-height:1.2;text-wrap:balance}
.brand h1 span{font-family:var(--f-hz);color:var(--pink)}
.sample-note{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 14px;font:inherit;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pink);color:#fff}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;margin-top:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.levels{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}

.lv{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;cursor:pointer;text-align:left;font:inherit;color:var(--fg);display:flex;flex-direction:column;gap:4px;min-width:0}
.lv[aria-pressed="true"]{border-color:var(--pink);box-shadow:0 0 0 2px var(--pink-soft)}
.lv b{font-size:13px}
.lv .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter{height:6px;border-radius:6px;background:var(--line);display:flex;overflow:hidden}
.meter i{display:block;height:100%}
.meter .ok{background:var(--ok)} .meter .wa{background:var(--warn)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:0;background:none;font:inherit;padding:6px 12px;border-radius:999px;color:var(--muted);cursor:pointer;font-weight:500}
.tab[aria-selected="true"]{background:var(--mint);color:var(--mint-ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-block:16px 12px}
.tools input,.tools select{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:7px 10px}
.tools input{flex:1 1 200px;min-width:0}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--pink-soft);color:var(--pink);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card .head{display:flex;justify-content:space-between;padding:6px 10px 0;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .hz{font-family:var(--f-hz);font-size:30px;text-align:center;padding:6px 8px 0;line-height:1.25;word-break:break-all}
.card .hz.long{font-size:21px}
.card .py{text-align:center;font-size:13px;color:var(--muted)}
.card .py em{font-style:normal;font-size:11px;margin-left:4px;color:var(--mint-ink)}
.card .th{background:var(--mint);color:var(--fg);padding:8px 10px;font-size:14px;text-align:center;margin-top:8px;flex:1;display:flex;align-items:center;justify-content:center}
.card .acts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.st{border:0;background:none;font:inherit;font-size:12px;padding:7px 2px;cursor:pointer;color:var(--muted)}
.st+.st{border-left:1px solid var(--line)}
.st[data-v="2"][aria-pressed="true"]{background:var(--ok-soft);color:var(--ok);font-weight:600}
.st[data-v="1"][aria-pressed="true"]{background:var(--warn-soft);color:var(--warn);font-weight:600}
.st[data-v="0"][aria-pressed="true"]{background:var(--no-soft);color:var(--no);font-weight:600}
.card .more{display:flex;justify-content:center;gap:4px;padding:4px 6px 8px}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:999px;font:inherit;font-size:12px;padding:3px 10px;cursor:pointer;color:var(--fg)}
.mini.ai{border-color:var(--pink);color:var(--pink)}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.pager{display:flex;justify-content:center;margin-top:16px}
/* flashcards */
.fc-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:16px}
.fc{width:min(440px,100%);min-height:260px;background:var(--surface);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;cursor:pointer;text-align:center}
.fc .hz{font-family:var(--f-hz);font-size:clamp(40px,10vw,64px);line-height:1.2}
.fc .ans{display:flex;flex-direction:column;gap:4px}
.fc .ans .p{color:var(--muted)}
.fc .ans .t{font-size:20px;background:var(--mint);padding:4px 14px;border-radius:10px}
.fc .hint{font-size:12px;color:var(--muted)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(440px,100%)}
.rate button{font:inherit;border:0;border-radius:12px;padding:10px;cursor:pointer;font-weight:600}
.r0{background:var(--no-soft);color:var(--no)} .r1{background:var(--warn-soft);color:var(--warn)} .r2{background:var(--ok-soft);color:var(--ok)}
.muted{color:var(--muted);font-size:13px}
.ex{display:flex;flex-direction:column;gap:2px;border-top:1px dashed var(--line);padding-top:10px;margin-top:4px;text-align:left;width:100%}
.ex .z{font-family:var(--f-zh);font-size:17px;line-height:1.6}
.ex mark{background:var(--pink-soft);color:var(--pink);border-radius:4px;padding:0 2px}
.ex .tt{font-size:14px}
.ex .ee{font-size:12px;color:var(--muted)}
.ex-label{font-size:11px;letter-spacing:.06em;color:var(--mint-ink);font-weight:600}
.card .hz{cursor:pointer}
.qmode{display:flex;justify-content:center}
.cloze{font-family:var(--f-zh);font-size:22px;line-height:1.7}
.cloze .gap{display:inline-block;min-width:3em;border-bottom:2px solid var(--pink);color:var(--pink)}
.strokes{display:flex;flex-direction:column;gap:6px}
.strokes .row{display:flex;flex-wrap:wrap;gap:8px}
.sk{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:6px 10px 4px;min-width:64px;background:var(--bg)}
.sk:hover{border-color:var(--pink)}
.sk b{font-family:var(--f-hz);font-size:30px;font-weight:500;line-height:1.2;background-image:linear-gradient(var(--line),var(--line)),linear-gradient(var(--line),var(--line));background-size:100% 1px,1px 100%;background-position:center;background-repeat:no-repeat;padding:0 6px}
.sk span{font-size:11px;color:var(--mint-ink)}
.src{font-size:11px;color:var(--muted)}
.hwbox{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--bg)}
.hwgrid{display:flex;flex-wrap:wrap;gap:12px}
.hwc{display:flex;flex-direction:column;align-items:center;gap:6px}
.hwc .pad{width:150px;height:150px;background:var(--surface);border:1px solid var(--line);border-radius:10px;touch-action:none}
.hwc .btns{display:flex;gap:4px}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600;text-align:center;max-width:150px}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.no{background:var(--warn-soft);color:var(--warn)}
.hwmsg{font-size:12px;color:var(--muted);min-height:1.2em;text-align:center;max-width:150px}
/* radical bubble map */
.rb-main{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px;align-items:start;margin-top:14px}
@media (max-width:760px){.rb-main{grid-template-columns:minmax(0,1fr)}}
.rb-stage{background:var(--surface);border:1px solid var(--line);border-radius:18px;position:relative;overflow:hidden;min-width:0}
.rb-stage svg{display:block;width:100%;height:min(66vh,620px);min-height:360px;touch-action:manipulation}
.rb-back{position:absolute;top:10px;left:10px;z-index:2}
.rb-count{position:absolute;bottom:8px;right:12px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rb-panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.rb-panel h3{margin:0;font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600}
.rb-big{font-family:var(--f-hz);font-weight:900;font-size:64px;line-height:1;display:flex;align-items:baseline;gap:12px}
.rb-big span{font-family:var(--f-th);font-size:18px;font-weight:500;color:var(--muted)}
.rb-th{font-size:18px;font-weight:700}
.rb-tag{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;font-weight:600;align-self:flex-start}
.rb-list{font-family:var(--f-hz);font-size:22px;letter-spacing:.12em;line-height:1.7;word-break:break-all}
.rb-list .out{opacity:.35}
.rb-words{display:flex;flex-direction:column;gap:6px}
.rb-word{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;text-align:left;font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:6px 10px;cursor:pointer}
.rb-word:hover{border-color:var(--pink)}
.rb-word b{font-family:var(--f-hz);font-size:20px;font-weight:700}
.rb-word small{color:var(--muted);font-size:12px;min-width:0}
.rb-word em{font-style:normal;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--mint);color:var(--mint-ink)}
.rb-legend{display:flex;flex-direction:column;gap:4px;font-size:13px}
.rb-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.rb-node{cursor:pointer;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .4s}
.rb-node:hover circle.c,.rb-node:focus-visible circle.c{stroke-width:4}
.rb-node:focus{outline:none}
.rb-node.sel circle.c{stroke-width:5}
.rb-node.out{opacity:.38!important}
.rb-han{font-family:var(--f-hz);font-weight:900;fill:var(--fg)}
.rb-lab{font-family:var(--f-th);fill:var(--muted)}
.rb-edge{stroke:var(--line);stroke-width:1.4;transition:opacity .6s}
@media (prefers-reduced-motion:reduce){.rb-node,.rb-edge{transition:none}}
.rad-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rad-chip{font:inherit;font-size:13px;border:1.5px solid var(--line);border-radius:999px;padding:3px 12px;cursor:pointer;background:var(--bg);color:var(--fg);display:inline-flex;gap:6px;align-items:center}
.rad-chip b{font-family:var(--f-hz);font-size:17px}
.opts.hz-opts .opt{font-family:var(--f-hz);font-size:22px}
/* quiz */
.qz{width:min(520px,100%);display:flex;flex-direction:column;gap:12px}
.qz .q{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;text-align:center}
.qz .q .hz{font-family:var(--f-hz);font-size:48px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:12px;cursor:pointer;min-height:52px}
.opt.good{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.bad{background:var(--no-soft);border-color:var(--no);color:var(--no)}
.score{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
/* AI panel */
.ai-panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;margin-top:16px}
.ai-panel h2{margin:0;font-size:18px}
.ai-panel textarea{font:inherit;font-family:var(--f-zh);width:100%;min-height:80px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);color:var(--fg);resize:vertical}
.ai-row{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;border:0;border-radius:12px;padding:9px 16px;background:var(--pink);color:#fff;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--pink-soft);color:var(--pink)}
.btn:disabled{opacity:.5;cursor:default}
.out{white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:12px;font-size:14px;min-height:40px}
.out .zh,.out{font-family:var(--f-th),var(--f-zh)}
.lock{font-size:13px;color:var(--muted);background:var(--pink-soft);padding:10px 12px;border-radius:12px}
dialog{border:0;border-radius:20px;padding:0;width:min(560px,calc(100% - 32px));background:var(--surface);color:var(--fg)}
dialog::backdrop{background:rgba(20,10,20,.45)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:10px;max-height:80vh;overflow:auto}
.dlg .hz{font-family:var(--f-hz);font-size:40px}
.dlg-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
@media (max-width:760px){.levels{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.levels{grid-template-columns:repeat(3,minmax(0,1fr))}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card .hz{font-size:26px}}
@media (prefers-reduced-motion:no-preference){.fc,.opt,.lv{transition:background .15s,border-color .15s,box-shadow .15s}}
.brand h1 .h1t{font-family:inherit;color:inherit}
.lang-sel{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px}
.head-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.th-badge{font-size:10px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:middle}
.hw-note{font-size:11px;color:var(--warn);max-width:160px;text-align:center}
.hwc .pad{width:150px;height:150px}
:root{--f-th:"Sarabun","Noto Sans Thai","Noto Sans JP","Noto Sans KR","Hiragino Sans","Apple SD Gothic Neo",system-ui,sans-serif}
.pl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.pl-f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.pl-f input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.pl-f small{font-size:11px}
.pl-adv summary{cursor:pointer;font-size:13px;color:var(--muted);margin-bottom:10px}
.pl-status{border-radius:14px;padding:12px 14px;font-weight:600;line-height:1.5}
.pl-status.ok{background:var(--ok-soft);color:var(--ok)} .pl-status.warn{background:var(--warn-soft);color:var(--warn)} .pl-status.bad{background:var(--no-soft);color:var(--no)}
.pl-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.pl-tile{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.pl-tile b{font-size:22px;font-variant-numeric:tabular-nums;color:var(--fg)} .pl-tile span{font-size:12px;color:var(--muted)}
.pl-tile.d b{font-size:16px;line-height:1.35}
.pl-tile.hi{border-color:var(--pink);background:var(--pink-soft)} .pl-tile.hi b{color:var(--pink)}
.pl-words{display:flex;flex-wrap:wrap;gap:8px}
.pl-w{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;padding:6px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:1px;max-width:200px;text-align:left}
.pl-w .z{font-size:18px} .pl-w .m{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.pl-w.done{border-color:var(--ok);background:var(--ok-soft)}
.pl-tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.pl-tbl th,.pl-tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)} .pl-tbl th{color:var(--muted);font-weight:600}
.pl-tbl tr.cur td{background:var(--pink-soft)}
.pl-scroll{overflow-x:auto}
.pl-samp .hz{font-size:40px;text-align:center}
.pl-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cf{display:flex;flex-direction:column;gap:10px;background:var(--bg);border-radius:12px;padding:14px;font-size:14px;line-height:1.55}
.cf-src{font-size:12px;color:var(--ok);font-weight:600}
.cf-ws{font-size:20px} .cf-key{font-weight:600}
.cf-it{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:4px}
.cf-w{font-size:18px;color:var(--pink)}
.cf-ex{padding-left:10px;border-left:3px solid var(--pink-soft)} .cf-ex .zh{font-size:16px}
.cf-ex .mini{padding:0 6px;font-size:11px}
.cf-tip{background:var(--warn-soft);color:var(--fg);border-radius:10px;padding:8px 10px}
.cf[hidden]{display:none}
:root{--simp:#2563c9} @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--simp:#8ab4ff}} :root[data-theme="dark"]{--simp:#8ab4ff}

/* ===== brand tokens (from the XIN-YA lantern logo) ===== */

  --mp-bg1:#fdf4e3;--mp-bg2:#f9e3d2;--mp-paper:#fffaf1;--mp-mtn1:#f1d6c4;--mp-mtn2:#e9c3ad;--mp-lock:#ddd3c4;--mp-lock-r:#efe8db;--mp-txt:#4a2c26;--mp-mut:#8f746c;--mp-sky:#fbe6dc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--mp-bg1:#1e1416;--mp-bg2:#2b1a1c;--mp-paper:#2a1d1f;--mp-mtn1:#3a2326;--mp-mtn2:#472a2d;--mp-lock:#4a3d3b;--mp-lock-r:#5c4e4b;--mp-txt:#f6e6dc;--mp-mut:#c2a59b;--mp-sky:#160f12}}

/* sky lantern (天燈) */
.sl{position:absolute;left:var(--x);bottom:-80px;width:calc(34px*var(--s));height:calc(44px*var(--s));border-radius:40% 40% 22% 22%;
  background:radial-gradient(ellipse at 50% 85%,#fff3c4 0 18%,#ffb347 45%,#e0612c 100%);box-shadow:0 0 calc(26px*var(--s)) rgba(255,170,70,.55);
  animation:rise 22s linear infinite;animation-delay:var(--d);opacity:.85}
.sl::after{content:"";position:absolute;left:28%;right:28%;bottom:-3px;height:4px;border-radius:2px;background:#7a2a12}
@keyframes rise{0%{transform:translate(0,0) rotate(-3deg);opacity:0}8%{opacity:.85}50%{transform:translate(18px,-55vh) rotate(3deg)}100%{transform:translate(-10px,-115vh) rotate(-2deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.sl{animation:none;opacity:0}}

function rbPack(nodes,iters=360){for(let it=0;it<iters;it++){for(const n of nodes){if(n.fixed)continue;n.x*=0.985;n.y*=0.985}
  for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes.at(i),b=nodes.at(j);let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||0.01;const min=a.r+b.r+6;

// ---------- quiz: units of 20 words, 4 mixed question types, points + combo ----------
const UNIT = 20;
const CONF_SKIP = new Set(["常常 經常","怕 害怕","逐漸 漸漸","好像 似乎","究竟 到底","立刻 馬上","然而 但是","否則 不然","不管 無論 儘管","竟然 居然 果然","但是 可是 不過","一下 一會兒","跟 和","由於 因為","突然 忽然","以前 之前","學 學習","號 日 天","交流 溝通","往往 常常","喜歡 愛","誠實 老實","坐 騎 開 搭"]);
S.qb = S.qb || {}; S.wrong = S.wrong || []; if(S.qpy==null) S.qpy=true; if(S.qmn==null) S.qmn=true;
const tsz = s => S.simp ? [...s].map(c=>TS[c]||c).join("") : s;
const rnd = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const tradForms = w => w[2].split("/").flatMap(f=>variants(f.trim()));
const levelWords = lv => W.filter(w=>w[1]===lv && canSee(w));
const units = lv => { const ws=levelWords(lv), u=[]; for(let i=0;i<ws.length;i+=UNIT) u.push(ws.slice(i,i+UNIT)); return u; };
const bookNo = w => w[0]>1226 ? w[0]-1226 : w[0];
const isPunct = s => !/[㐀-鿿]/.test(s);

// split a token list so that `word` is one token; returns {tk, at} or null
function blankTokens(tk, forms){
  for(const f of forms.sort((a,b)=>b.length-a.length)){
    const i=tk.findIndex(t=>t[0]===f); if(i>=0) return {tk, at:i, form:f};
    const s=tk.map(t=>t[0]).join(""), pos=s.indexOf(f); if(pos<0) continue;
    // rebuild around the match
    const out=[]; let p=0, at=-1;
    for(const t of tk){ const a=p, b=p+t[0].length; p=b;
      if(b<=pos || a>=pos+f.length){ out.push(t); continue; }
      if(a<pos) out.push([t[0].slice(0,pos-a),""]);
      if(at<0){ at=out.length; out.push([f, ""]); }
      if(b>pos+f.length) out.push([t[0].slice(pos+f.length-a),""]); }
    return {tk:out, at, form:f};
  }
  return null;
}
const pyOf = form => { const w=W.find(x=>tradForms(x).includes(form)); return w ? w[4] : ""; };
function tkHTML(tk, blankAt, filled){
  return tk.map((t,i)=>{
    if(i===blankAt) return `<span class="tk gap2 ${filled?"fill "+filled.cls:""}"><small>${filled&&S.qpy?esc(filled.py):"&nbsp;"}</small><b>${filled?esc(tsz(filled.z)):"&nbsp;"}</b></span>`;
    return `<span class="tk"><small>${S.qpy&&t[1]?esc(t[1]):"&nbsp;"}</small><b>${esc(tsz(t[0]))}</b></span>`; }).join("");
}

// ----- question builders -----
function qMean(w, pool){ const o=[w]; let g=0; while(o.length<4&&g++<300){ const x=rnd(pool); if(!o.some(y=>meaning(y).txt===meaning(x).txt)) o.push(x); } return {type:"mean", w, opts:shuffle(o)}; }
function qMeanR(w, pool){ const o=[w]; let g=0; while(o.length<4&&g++<300){ const x=rnd(pool); if(!o.some(y=>y[2]===x[2]||meaning(y).txt===meaning(x).txt)) o.push(x); } return {type:"meanR", w, opts:shuffle(o)}; }
function qCloze(w, pool){
  const tk=EXT[w[0]]; if(!tk) return null; const b=blankTokens(tk.map(t=>t.slice()), tradForms(w)); if(!b) return null;
  const same=pool.filter(x=>x!==w && x[5]===w[5] && !tradForms(x).some(f=>b.tk.map(t=>t[0]).join("").includes(f)));
  const o=[w]; let g=0; const src=same.length>=3?same:pool; while(o.length<4&&g++<300){ const x=rnd(src); if(x!==w && !o.some(y=>y[2]===x[2])) o.push(x); }
  return {type:"cloze", w, tk:b.tk, at:b.at, form:b.form, opts:shuffle(o), tr:w[9], trEn:w[10]};
}
function qOrder(w){
  const tk=EXT[w[0]]; if(!tk) return null;
  let tiles=[], end="";
  tk.forEach((t,i)=>{ if(isPunct(t[0])){ if(i===tk.length-1) end=t[0]; else if(tiles.length) tiles[tiles.length-1]=[tiles.at(-1)[0]+t[0], tiles.at(-1)[1]]; } else tiles.push(t.slice()); });
  if(tiles.length<3 || tiles.length>8) return null;
  const ans=tiles.map(t=>t[0]).join(""); let sh=shuffle(tiles.map((t,i)=>({t,i}))), g=0;
  while(sh.map(x=>x.t[0]).join("")===ans && g++<10) sh=shuffle(sh);
  return {type:"order", w, tiles, bank:sh, end, ans, tr:w[9], trEn:w[10], pick:[]};
}
function qConf(lv, prefer){
  const gs=CONF.filter(g=>!CONF_SKIP.has(g.words.join(" ")) && CF_ORD[g.lv]<=CF_ORD[lv]);
  let cand=gs.filter(g=>prefer.some(w=>g.words.some(x=>tradForms(w).includes(x)))); if(!cand.length) cand=gs.filter(g=>g.lv===lv); if(!cand.length) cand=gs;
  for(let k=0;k<20 && cand.length;k++){ const g=rnd(cand), it=rnd(g.items), e=rnd(it.ex); if(!e||!e.tk) continue;
    const b=blankTokens(e.tk.map(t=>t.slice()), [it.w]); if(!b) continue;
    if(g.words.filter(x=>x!==it.w).some(x=>e.zh.replace(it.w,"").includes(x))) continue;
    return {type:"conf", g, it, e, tk:b.tk, at:b.at, opts:shuffle(g.words.slice()), ans:it.w}; }
  return null;
}
function buildSession(words, lv, n){
  const pool=levelWords(lv), ws=shuffle(words), qs=[]; let wi=0;
  const plan=shuffle(["cloze","cloze","cloze","order","order","conf","conf","mean","mean","meanR"].concat(n>10?["cloze","cloze","order","order","conf","mean","mean","meanR","meanR","mean"]:[])).slice(0,n);
  for(const ty of plan){
    const w=ws[wi++ % ws.length]; let q=null;
    if(ty==="cloze") q=qCloze(w,pool); else if(ty==="order") q=qOrder(w); else if(ty==="conf") q=qConf(lv, words);
    if(!q) q = Math.random()<.6 ? qMean(w,pool) : qMeanR(w,pool);
    qs.push(q);
  }
  return qs;
}

function feedback(q){
  const ok=q.correct; let det="";
  if(q.type==="order") det=`<div class="zh">${esc(tsz(q.ans+q.end))}</div><div class="muted">${esc(trOf(q)||"")}</div>`;
  else if(q.type==="conf") det=`<div><b>${esc(tsz(q.ans))}</b> — ${esc(q.it.use)}</div><div class="muted">${esc(q.g.key)}</div><div class="cf-tip">${esc(q.g.tip)}</div>`;
  else det=`<div><b class="zh">${esc(hz(q.w))}</b> ${esc(q.w[4])} · ${mHTML(q.w)}</div>${q.type==="cloze"&&trOf(q)?`<div class="muted">${esc(trOf(q))}</div>`:""}`;
  return `<div class="qfb ${ok?"good":"bad"}"><b>${ok?t("qzRight",{p:q.pts}):t("qzBad")}</b>${ok&&q.type!=="conf"?"":det}
    <div class="pl-row"><button class="btn" data-qa="next">${t("qzNext")}</button>${q.w?`<button class="mini" data-qa="open">${t("openDetail")}</button>`:""}</div></div>`;
}
function answer(correct){ markDay();
  const q=QZ.qs[QZ.i]; QZ.answered=true; q.correct=correct;
  if(correct){ QZ.streak++; QZ.maxStreak=Math.max(QZ.maxStreak,QZ.streak); q.pts=10+(QZ.streak>=3?5:0); QZ.score+=q.pts; QZ.ok++;
    if(q.w){ S.wrong=S.wrong.filter(n=>n!==q.w[0]); } }
  else { QZ.streak=0; if(q.w){ QZ.missed.add(q.w[0]); if(!S.wrong.includes(q.w[0])) S.wrong.push(q.w[0]); if(S.st[q.w[0]]===2) S.st[q.w[0]]=1; } }
  save(); renderLevels(); renderQuiz2();
  try{ correct ? (cheer(QZ.streak), coinPop(q.pts, QZ.streak)) : boo(); }catch(e){}
}
let actx=null; function beep(f,d){ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=f; g.gain.value=.05; o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+d); }
// happy "ding-ding-ding!" arpeggio + sparkle; bigger fanfare on a 3+ streak
function tone(f,t0,d,type="triangle",vol=.12){ const o=actx.createOscillator(), g=actx.createGain(); o.type=type; o.frequency.setValueAtTime(f,t0);
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol,t0+.015); g.gain.exponentialRampToValueAtTime(.0001,t0+d); o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+d+.02); }
function cheer(streak){ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); const t=actx.currentTime;
  const notes = streak>=3 ? [523.25,659.25,783.99,1046.5,1318.5] : [659.25,783.99,1046.5];
  notes.forEach((f,i)=>tone(f,t+i*.075,.35));
  [2093,2637,3136].forEach((f,i)=>tone(f,t+notes.length*.075+i*.05,.25,"sine",.05)); }
function boo(){ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const t=actx.currentTime; tone(330,t,.18,"sine",.08); tone(247,t+.14,.3,"sine",.08); }
function coinPop(pts, streak){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box=document.createElement("div"); box.className="coin-fx" + (streak>=3?" big":"");
  box.innerHTML=`<div class="coin"><b>+${pts}</b></div>` + Array.from({length:streak>=3?12:8},(_,i)=>`<i style="--a:${i*(360/(streak>=3?12:8))}deg"></i>`).join("");
  document.body.appendChild(box); setTimeout(()=>box.remove(),1300);
  setTimeout(()=>{ const p=document.querySelector(".qpts"); if(p){ p.classList.remove("bump"); void p.offsetWidth; p.classList.add("bump"); } },550); }
function renderResult(){
  const n=QZ.qs.length, p=Math.round(QZ.ok/n*100), s=stars(p), prev=S.qb[QZ.key], nb=!prev||QZ.score>prev.b;
  if(!QZ.saved){ QZ.saved=true; if(QZ.key){ S.qb[QZ.key]={b:Math.max(QZ.score,prev?prev.b:0), s:Math.max(s,prev?prev.s:0)}; save(); } QZ.newBest=nb&&!!QZ.key&&QZ.score>0; }
  const ms=[...QZ.missed].map(no=>W[no-1]);
  $("#qz").innerHTML = `<div class="qres"><div class="big">${starHTML(s)}</div><h2>${t("qzDone")} ${esc(QZ.title)}</h2>
    <div class="qscore">${t("qzPts",{s:QZ.score})}</div>${QZ.newBest?`<div class="combo">${t("qzNewBest")}</div>`:""}
    <div class="muted">${t("qzRes",{a:QZ.ok,b:n,p})}${QZ.maxStreak>=3?" · "+t("qzCombo",{n:QZ.maxStreak}):""}</div>
    ${ms.length?`<div class="qmiss"><b>${t("qzMissed")}</b><div class="pl-words">${ms.map(w=>`<button class="pl-w" data-no="${w[0]}"><span class="z">${esc(hz(w))}</span><span class="m">${esc(w[4])} · ${esc(meaning(w).txt)}</span></button>`).join("")}</div></div>`:""}
    <div class="pl-row" style="justify-content:center"><button class="btn" data-qa="again">${t("qzAgain")}</button>${ms.length?`<button class="btn ghost" data-qa="review">${t("qzReview")}</button>`:""}<button class="mini" data-qa="menu">${t("qzBack")}</button></div></div>`;
}
$("#qz").onclick=e=>{
  const a=e.target.closest("[data-qa]"), lv=S.lv;
  const u=e.target.closest("[data-u]"); if(u){ const i=+u.dataset.u; return startQuiz(lv+"-"+(i+1), t("qzUnit",{n:i+1}), units(lv)[i], 10); }
  const tg=e.target.closest("[data-tg]"); if(tg){ S[tg.dataset.tg]=!S[tg.dataset.tg]; save(); return renderQuiz2(); }
  const pw=e.target.closest(".pl-w"); if(pw) return openWord(W[+pw.dataset.no-1]);
  if(a){ const k=a.dataset.qa;
    if(k==="all") return startQuiz(lv+"-all", t("qzAll").replace(/\s*\(.*$/,""), levelWords(lv), 20);
    if(k==="wrong"){ const ws=S.wrong.map(n=>W[n-1]).filter(w=>w&&w[1]===lv); if(!ws.length) return; return startQuiz(null, t("qzWrong",{n:ws.length}), ws, Math.min(10,Math.max(5,ws.length))); }
    if(k==="exit"||k==="menu"){ QZ=null; return renderQuizMenu(); }
    if(k==="again") return startQuiz(QZ.key, QZ.title, QZ.words, QZ.qs.length);
    if(k==="review"){ planDeck=[...QZ.missed].map(n=>W[n-1]); return showTab("cards"); }
    if(k==="say"){ return speak(QZ.qs[QZ.i].w); }
    if(k==="open"){ return openWord(QZ.qs[QZ.i].w); }
    if(k==="next"){ QZ.i++; QZ.answered=false; if(QZ.i>=QZ.qs.length) QZ.done=true; return renderQuiz2(); }
    const q=QZ.qs[QZ.i];
    if(k==="clear"){ q.pick=[]; return renderQuiz2(); }
    if(k==="submit"){ const s=q.pick.map(i=>q.bank[i].t[0]).join(""); q.okAns = s===q.ans; return answer(q.okAns); }
  }
  if(!QZ || QZ.done) return; const q=QZ.qs[QZ.i];
  if(q.type==="order" && !QZ.answered){
    const b=e.target.closest("[data-bank]"), an=e.target.closest("[data-ans]");
    if(b){ const k=+b.dataset.bank; if(!q.pick.includes(k)) q.pick.push(k); try{ speak(null,q.bank[k].t[0]); }catch(_){} return renderQuiz2(); }
    if(an){ const k=+an.dataset.ans; q.pick=q.pick.filter(x=>x!==k); return renderQuiz2(); }
    return;
  }
  const o=e.target.closest(".opt"); if(!o||QZ.answered) return;
  const pick=q.opts[+o.dataset.o]; q.pick=pick;
  answer(q.type==="conf" ? pick===q.ans : pick===q.w);
};

  vi:"The learner is Vietnamese: when useful, link words to their Sino-Vietnamese (Hán-Việt) reading as a memory aid, and warn about false friends.",
  ja:"The learner is Japanese: point out kanji false friends (same characters, different meaning, e.g. 手紙), traditional vs Japanese shinjitai shapes, and pronunciation differences.",

Use Taiwan traditional characters${S.simp?" (the learner prefers simplified characters, so write Chinese in simplified)":""}. Give pinyin for Chinese examples.

  catch(e){ out.textContent = e?.code==="not_granted" ? t("aiDenied") : e?.code==="rate_limited" ? t("aiRate") : t("aiErr"); }
}

// ---------- study plan (logic from TOCFL_詞彙學習計畫計算器.xlsx) ----------
const LOCALE = {th:"th-TH",en:"en-GB",vi:"vi-VN",ja:"ja-JP",ko:"ko-KR"};
const day0 = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const addD = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parseD = s => { const [y,m,d]=String(s).split("-").map(Number); return y ? new Date(y,m-1,d) : null; };
const diffD = (a,b) => Math.round((b-a)/864e5);
const fmtD = d => d.toLocaleDateString(LOCALE[S.lang]||"th-TH",{year:"numeric",month:"short",day:"numeric"});
const PLAN_DEF = {exam:ymd(addD(day0(),182)), band:"B", dpw:6, res:3, mNew:1, mRev:0.2, nRev:4, sug:20, max:30, samp:{}, today:null};
S.plan = Object.assign({}, PLAN_DEF, S.plan||{});
let planDeck = null;
const bandOf = w => w[1][0]==="B" ? "B" : "A";
const bandWords = b => W.filter(w=>bandOf(w)===b);
const planBands = () => S.plan.band==="A" ? ["A"] : ["A","B"];

function planCalc(){
  const P=S.plan, today=day0(), exam=parseD(P.exam)||addD(today,182);
  let total=0, conf=0, est=0, unsure=0;
  for(const b of planBands()){
    const ws=bandWords(b); total+=ws.length;
    const c=ws.filter(w=>S.st[w[0]]===2).length, chk=ws.filter(w=>S.st[w[0]]!=null).length;
    const sp=P.samp[b], rate = sp&&sp.n ? Math.min(1, sp.ok/sp.n) : 0;
    conf+=c; unsure+=chk-c; est+=Math.round((ws.length-chk)*rate);
  }
  const known=conf+est, remain=Math.max(0,total-known);
  const cutoff=addD(exam,-P.res*7), daysLeft=diffD(today,exam);
  const studyDays=Math.max(0, Math.floor(diffD(today,cutoff)*P.dpw/7));
  const perDay = remain===0 ? 0 : studyDays<=0 ? null : Math.ceil(remain/studyDays);
  const mins = perDay==null ? null : Math.round(perDay*P.mNew + perDay*P.nRev*P.mRev);
  const earliest = addD(today, Math.ceil(remain/P.sug*7/P.dpw) + P.res*7);
  let st, cls;
  if(remain===0){ st=t("plDone"); cls="ok"; }
  else if(perDay==null){ st=t("plLate0"); cls="bad"; }
  else if(perDay>P.max){ st=t("plTooMany",{n:perDay,max:P.max,d:fmtD(earliest)}); cls="bad"; }
  else if(perDay>P.sug){ st=t("plHard",{n:perDay,s:P.sug,m:mins}); cls="warn"; }
  else { st=t("plOk",{n:perDay,m:mins}); cls="ok"; }
  return {today,exam,total,conf,est,known,unsure,remain,cutoff,daysLeft,studyDays,perDay,mins,earliest,st,cls};
}

// today's list: words in book order that are not yet "know it", fixed for the day
function planToday(c, force){
  const P=S.plan, key=ymd(c.today), n=c.perDay||0;
  if(force || !P.today || P.today.d!==key || P.today.band!==P.band || P.today.n!==n){
    const nos=[]; for(const b of planBands()) for(const w of bandWords(b)){ if(nos.length>=n) break; if(S.st[w[0]]!==2 && canSee(w)) nos.push(w[0]); }
    P.today={d:key, band:P.band, n, nos}; save();
  }
  return P.today.nos.map(no=>W[no-1]);
}

// placement test (spot check): random unchecked words, pick the meaning
let pt=null;
function ptStart(b){
  const pool=bandWords(b).filter(w=>S.st[w[0]]==null), all=bandWords(b);
  const qs=[]; const used=new Set();
  while(qs.length<20 && used.size<pool.length){ const w=pool[Math.floor(Math.random()*pool.length)]; if(used.has(w[0])) continue; used.add(w[0]);
    const opts=[w]; let g=0; while(opts.length<4 && g++<200){ const o=all[Math.floor(Math.random()*all.length)]; if(!opts.some(x=>meaning(x).txt===meaning(o).txt)) opts.push(o); }
    qs.push({w,opts:opts.sort(()=>Math.random()-.5)}); }
  pt={b,qs,i:0,ok:0,n:0}; renderSamp();
}

  let best=null, bs=0;
  for(const g of CONF){ const hit=g.words.filter(w=>q.includes(w)); const sc=hit.length*10+hit.join("").length;
    if(hit.length>=Math.min(2,g.words.length) && sc>bs){ bs=sc; best=g; } }

  for(;;){ const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; if(!set.has(k)) break; n++; d.setDate(d.getDate()-1); } return n; }

let mpNodes=[], mpFirst=true;
function mpBuild(){
  const lv=S.lv, us=units(lv), out=[];
  us.forEach((u,i)=>{ out.push({k:"u",i,words:u,key:lv+"-"+(i+1)}); if((i+1)%5===0 && i<us.length-1) out.push({k:"rev",i,from:i-4,to:i,words:us.slice(i-4,i+1).flat(),key:lv+"-r"+(i+1)}); });
  out.push({k:"boss",words:levelWords(lv),key:lv+"-all"});
  // unlock: a node opens when the previous unit/review has at least one star
  let open=true, curSet=false;
  out.forEach(n=>{ const r=S.qb[n.key]; n.st=r?r.s:0; n.best=r?r.b:0; n.open=open; n.done=!!r&&r.s>0;
    if(open && !n.done && !curSet){ n.cur=true; curSet=true; }
    if(!n.done) open=false; });
  if(!curSet) out[out.length-1].cur=true;
  if(isTrial()){ const all=lvAll(lv), tot=Math.ceil(all.length/UNIT), tr=[out[0]];
    for(let i=1;i<tot;i++){ tr.push({k:"u",i,words:[],paid:true,a:bookNo(all[i*UNIT]),b:bookNo(all[Math.min((i+1)*UNIT,all.length)-1])}); if((i+1)%5===0 && i<tot-1) tr.push({k:"rev",i,from:i-4,to:i,words:[],paid:true}); }
    tr.push({k:"boss",words:[],paid:true}); tr.forEach((n,j)=>{ if(j){ n.open=false; n.cur=false; n.done=false; n.st=0; } }); return tr; }
  return out;
}

  sh.innerHTML = `<h2>${title}</h2><div class="muted">${esc(sub)} · ${starHTML(n.st)} ${n.best?t("qzBest",{s:n.best}):""}</div>
    ${n.open?"":`<div class="mp-lockmsg">${t("mpLocked")}</div>`}
    ${show.length?`<div class="mp-ws">${show.map(w=>`<button class="mp-w ${S.st[w[0]]===2?"k":""}" data-no="${w[0]}"><b>${esc(hz(w))}</b><small>${esc(w[4])} · ${esc(meaning(w).txt).slice(0,18)}</small></button>`).join("")}</div>`:""}
    <div class="mp-acts">${n.k==="u"?`<button class="lg-btn ghost" data-sa="learn">🃏 ${t("mpLearn")}</button>`:""}<button class="lg-btn" data-sa="quiz" style="${n.k==="u"?"":"grid-column:1/-1"}">✍️ ${t(n.k==="boss"?"mpQuiz20":"mpQuiz10")}</button></div>
    <button class="mini" data-sa="close" style="align-self:center">${t("close")}</button>`;
  sh.dataset.n=i; $("#mpSheet").hidden=false;
}
$("#mpSheet").onclick=e=>{
  if(e.target.id==="mpSheet") return $("#mpSheet").hidden=true;
  const w=e.target.closest("[data-no]"); if(w) return openWord(W[+w.dataset.no-1]);
  const a=e.target.closest("[data-sa]"); if(!a) return; const n=mpNodes[+$("#mpSh").dataset.n]; $("#mpSheet").hidden=true;
  if(a.dataset.sa==="learn"){ planDeck=n.words.slice(); return showTab("cards"); }
  if(a.dataset.sa==="quiz"){ showTab("quiz"); const title = n.k==="u"?t("qzUnit",{n:n.i+1}) : n.k==="rev"?t("mpRev"):t("mpBoss"); return startQuiz(n.key, title, n.words, n.k==="boss"?20:10); }
};
$("#mpPath").onclick=e=>{ const b=e.target.closest(".mp-n"); if(b) openSheet(+b.dataset.n); };
$("#mpLv").onchange=e=>{ S.lv=e.target.value; S.page=""; QZ=null; mpFirst=true; save(); renderAll(); };
$("#mpMe").onclick=()=>{ if(isTrial()) return showLogin(); const m=$("#mpMenu"); m.hidden=!m.hidden; };
$("#mpOut").onclick=()=>{ S.auth=null; save(); $("#mpMenu").hidden=true; renderAll(); };
$("#mpGoal").onclick=()=>showTab("plan");
$("#mpRev").onclick=()=>{ const ws=S.wrong.map(n=>W[n-1]).filter(Boolean); showTab("quiz"); if(ws.length) startQuiz(null, t("qzWrong",{n:ws.length}), ws, Math.min(10,Math.max(5,ws.length))); };
document.querySelector(".mp-nav").onclick=e=>{ const b=e.target.closest("[data-go]"); if(b) showTab(b.dataset.go); };
window.addEventListener("resize",()=>{ if(S.tab==="map") renderMap(); });

$("#payLater").onclick=closePay; $("#payHave").onclick=()=>{ closePay(); showLogin(); }; $("#payBuy").onclick=()=>closePay();
$("#pay").addEventListener("click",e=>{ if(e.target.id==="pay") closePay(); });
// ---------- tabs ----------
function showTab(tb){
  S.tab=tb; save();
  document.querySelectorAll(".tab[data-tab]").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===tb));
  ["map","list","cards","quiz","rad","ai","plan"].forEach(k=>$("#v-"+k).hidden = k!==tb);
  document.body.classList.toggle("on-map", tb==="map"); document.querySelectorAll(".mp-nav [data-go]").forEach(b=>b.classList.toggle("on",b.dataset.go===tb));
  if(tb==="map"){ window.scrollTo({top:0}); renderMap(); }
  if(tb==="rad" && !rbDrawn){ rbDrawn=true; rbRenderChips(); rbOverview(); }
  if(tb==="cards"){ if(planDeck){ deck=planDeck; planDeck=null; di=0; flipped=false; } else buildDeck(); renderCard(); }
  if(tb==="plan") renderPlan();
  if(tb==="quiz") renderQuiz2();
}
document.querySelector(".bar .tabs").onclick=e=>{ const b=e.target.closest(".tab[data-tab]"); if(b) showTab(b.dataset.tab); };
function renderAll(){
  renderPickers();
  $("#trialBar").hidden=!isTrial(); document.body.classList.toggle("is-trial", isTrial());
  const bB=S.lv[0]==="B"; document.body.classList.toggle("band-b", bB); document.body.classList.toggle("band-a", !bB);
  renderLevels(); renderCfChips(); fillPages(); renderList();
  if(rbDrawn){ rbRenderChips(); if(rbView) rbDetail(rbView, rbSel&&rbSel.c); else rbOverview(); }
  if(S.tab==="cards"){ buildDeck(); renderCard(); }
  if(S.tab==="quiz") renderQuiz2();
  if($("#dlg").open && dW) openWord(dW);
  if(S.tab==="plan") renderPlan();
  if(S.tab==="map") renderMap();
}
$("#scTrad").setAttribute("aria-pressed",!S.simp); $("#scSimp").setAttribute("aria-pressed",S.simp);
applyI18n(); renderAll(); if(!S.mapSeen){ S.mapSeen=1; S.tab="map"; }
showTab(S.tab||"map");

document.getElementById("trLoginBtn").onclick=()=>showLogin();
window.showLogin=showLogin; window.S=S;
document.getElementById("boot").remove();
</script>

</body>
