# Google Sheet  →  data/*.json  →  commit  →  Vercel deploys automatically
name: Sync Google Sheet

on:
  schedule:
    - cron: "0 20 * * *"        # every day 03:00 Thailand time
  workflow_dispatch:            # Actions → Sync Google Sheet → Run workflow (update now)

permissions:
  contents: write

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install openpyxl google-auth requests

      - name: Pull the sheet and rebuild data/
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}   # optional — only if the sheet is shared with a service account
        run: |
          if [ -z "$SHEET_ID" ]; then echo "::error::ยังไม่ได้ตั้ง secret SHEET_ID (Settings → Secrets and variables → Actions)"; exit 1; fi
          python scripts/sheet.py sync --sheet-id "$SHEET_ID" --fetch --report /tmp/report.md

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- data hw; then echo "ไม่มีอะไรเปลี่ยน"; exit 0; fi
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add data hw
          git commit -m "data: sync from Google Sheet" -m "$(head -c 3000 /tmp/report.md)"
          git push
