# Files added to hw/tw/  →  merged into hw/tw.json  →  commit  →  Vercel deploys
name: Merge Taiwan stroke order

on:
  push:
    paths:
      - "hw/tw/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/merge_strokes.py
      - name: Commit hw/tw.json
        run: |
          if git diff --quiet -- hw/tw.json; then echo "ไม่มีอะไรเปลี่ยน"; exit 0; fi
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add hw/tw.json
          git commit -m "strokes: merge hw/tw → hw/tw.json"
          git push
